name: CI on Debian trixie

# gfcode 是纯 Scheme 项目（无 xmake 构建系统），依赖外部 Goldfish 提供的
# bin/gf 运行时来跑测试与格式化检查。参考 ~/git/liii 的各组件 CI：
# 安装最新版 goldfish deb → gf fmt --check → gf test 各 domain 的 tests。
# 与 liii 固定 GOLDFISH_VERSION 不同，这里通过 releases/latest API 取最新 tag，
# 始终用最新发布的 Goldfish（参考 liii/cd-debian13.yml 的取最新版做法）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'agent/**'
      - 'code/**'
      - 'extensions/**'
      - 'review/**'
      - 'simplify/**'
      - 'tests/**'
      - 'tui/**'
      - 'web-search/**'
      - 'gfproject.json'
      - 'gf_check.json'
      - '.github/workflows/ci-debian.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'agent/**'
      - 'code/**'
      - 'extensions/**'
      - 'review/**'
      - 'simplify/**'
      - 'tests/**'
      - 'tui/**'
      - 'web-search/**'
      - 'gfproject.json'
      - 'gf_check.json'
      - '.github/workflows/ci-debian.yml'

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    container: debian:trixie
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git add safe directory
        run: git config --global --add safe.directory '*'

      - name: Install Goldfish (latest)
        run: |
          TAG=$(curl -fsSL -H "User-Agent: gfcode-ci" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/MoganLab/goldfish/releases/latest \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest goldfish release: $TAG"
          curl -fsSL -o /tmp/goldfish.deb \
            "https://github.com/MoganLab/goldfish/releases/download/$TAG/goldfish-scheme-x86_64-$TAG.deb"
          apt-get install -y /tmp/goldfish.deb
          gf version

      - name: Format Check
        run: |
          gf fmt --check ai
          gf fmt --check agent
          gf fmt --check code
          gf fmt --check extensions
          gf fmt --check review
          gf fmt --check simplify
          gf fmt --check tui
          gf fmt --check web-search
          gf fmt --check tests

      - name: Run code metrics check
        run: gf check

      - name: Run tests
        run: |
          gf test ai/tests/liii
          gf test agent/tests/liii
          gf test code/tests/liii
          gf test review/tests/liii
          gf test simplify/tests/liii
          gf test tui/tests/liii
          gf test web-search/tests/liii
          gf test tests/liii
